# Profile used by the free public deployment (Render / Koyeb / Fly ...).
# Activated with SPRING_PROFILES_ACTIVE=cloud (set in the Dockerfile).
#
# Instead of a separate MySQL container this runs an in-memory H2 database in
# MySQL-compatibility mode. The schema and the seeded POIs are (re)created from
# db/h2/*.sql on every start, so user accounts and ratings added through the
# live site are reset whenever the app restarts or is redeployed.

spring.datasource.url=jdbc:h2:mem:rateme;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Bind to the port the host assigns (Render/Koyeb/Fly set $PORT), 8080 locally.
server.port=${PORT:8080}

# Hosts capture stdout; keep the file log in a guaranteed-writable temp dir.
logging.file.name=${java.io.tmpdir}/rateme-backend.log
logging.level.de.hskl.rateme=INFO
