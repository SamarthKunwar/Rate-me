<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateMe</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css?v=20260709-4">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js?v=20260709-4" defer></script>
</head>

<body>
    <header class="app-header">
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
                <path d="M9 5h13v5a7.5 7.5 0 0 1-7.5 7.5A7.5 7.5 0 0 1 7 10V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M22 8h2.5a2.8 2.8 0 0 1 0 5.6H22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="6.5" y1="26.5" x2="17.5" y2="26.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="12" y1="17.5" x2="12" y2="26.5" stroke="currentColor" stroke-width="2"/>
            </svg>
            <div>
                <h1>RateMe</h1>
                <p>Bewerte Restaurants, Cafés und Kneipen in und um Zweibrücken</p>
            </div>
        </div>
        <div class="account-area">
            <span id="currentUser">Nicht angemeldet</span>
            <div class="auth-buttons">
                <button id="loginButton" type="button">Anmelden</button>
                <button id="registerButton" type="button">Registrieren</button>
                <button id="logoutButton" type="button">Abmelden</button>
                <button id="deleteUserButton" type="button">Account löschen</button>
            </div>
        </div>
    </header>

    <div id="authModal" class="auth-modal hidden">
        <div class="auth-dialog">
            <div class="auth-dialog-header">
                <h2 id="authTitle">Anmelden</h2>
                <button id="closeAuthButton" type="button">Schließen</button>
            </div>
            <div id="loginFields" class="auth-fields">
                <input id="authUsername" type="text" placeholder="Benutzername">
                <input id="authPassword" type="password" placeholder="Passwort">
            </div>
            <div id="registerFields" class="auth-fields hidden">
                <input id="authEmail" type="email" placeholder="E-Mail">
                <input id="authFirstname" type="text" placeholder="Vorname">
                <input id="authLastname" type="text" placeholder="Nachname">
                <input id="authStreet" type="text" placeholder="Straße">
                <input id="authStreetNr" type="text" placeholder="Nr.">
                <input id="authZip" type="text" placeholder="PLZ">
                <input id="authCity" type="text" placeholder="Ort">
            </div>
            <div class="auth-dialog-actions">
                <button id="submitAuthButton" type="button">Anmelden</button>
            </div>
            <small id="authMessage"></small>
        </div>
    </div>

    <main class="app-layout">
        <section class="map-section">
            <h2>Karte</h2>
            <div id="map"></div>
        </section>
        <section class="content-section">
            <div class="w3-bar">
                <button class="tab-button active" data-tab="ratingsTab">Bewertungen</button>
                <button class="tab-button" data-tab="myRatingsTab">Meine Bewertungen</button>
            </div>
            <section id="ratingsTab" class="tab-content active">
                <h2 id="poiName">Bitte Gastronomie auswählen</h2>
                <dl id="poiDetails"></dl>
                <div class="ratings-overview">
                    <h3>Bewertungen</h3>
                    <div id="ratingsList">
                        <p>Noch keine Gastronomie ausgewählt.</p>
                    </div>
                </div>
                <div id="ratingForm" class="rating-form">
                    <h3>Bewertung schreiben</h3>

                    <input id="ratingGrade" type="hidden" value="">
                    <div class="rating-stars" aria-label="Sterne auswählen">
                        <button class="star-button" type="button" data-grade="1" aria-label="1 Stern">★</button>
                        <button class="star-button" type="button" data-grade="2" aria-label="2 Sterne">★</button>
                        <button class="star-button" type="button" data-grade="3" aria-label="3 Sterne">★</button>
                        <button class="star-button" type="button" data-grade="4" aria-label="4 Sterne">★</button>
                        <button class="star-button" type="button" data-grade="5" aria-label="5 Sterne">★</button>
                    </div>

                    <textarea id="ratingText" placeholder="Deine Bewertung"></textarea>
                    <input id="ratingImage" type="file" accept="image/*">

                    <div class="rating-actions">
                        <button id="createRatingButton" type="button">Bewertung speichern</button>
                        <button id="cancelEditButton" class="hidden" type="button">Bearbeiten abbrechen</button>
                    </div>

                    <small id="ratingMessage"></small>
                </div>
            </section>

            <section id="myRatingsTab" class="tab-content">
                <h2>Meine Bewertungen</h2>
                <div id="myRatingsList">
                    <p>Bitte anmelden, um eigene Bewertungen zu sehen.</p>
                </div>
            </section>
        </section>
    </main>
</body>

</html>
